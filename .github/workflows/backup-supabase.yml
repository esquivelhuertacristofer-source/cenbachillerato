name: Backup diario de Supabase

# ============================================================================
# POR QUÉ EXISTE ESTE WORKFLOW
#
# Supabase, en el plan Free, NO ofrece backups automáticos ni Point-in-Time
# Recovery (PITR) — eso es exclusivo del plan Pro ($25/mes, ver
# scripts/monitoreo-supabase.sql para los umbrales de cuándo pagarlo). Sin
# este workflow, un DROP TABLE accidental, un bug en un script con
# service_role, o un borrado masivo hecho a mano en el SQL Editor son
# IRRECUPERABLES: no hay ningún respaldo en Supabase al que volver.
#
# Por eso este workflow es OBLIGATORIO antes de dar de alta cualquier escuela
# real — ver docs/diagnostico/AUDITORIA-GOLD-2026-07-13.md (hallazgo MEDIO
# "Sin política de backup/PITR documentada") y
# docs/diagnostico/OPTIMIZACION-ESCALA-2026-07-17.md.
#
# CÓMO CREAR EL SECRET SUPABASE_DB_URL (una sola vez, lo hace el usuario a mano):
#   1. Dashboard de Supabase → Project Settings → Database → "Connection string".
#   2. Elegir el modo "Session" del connection pooler (puerto 5432). NO usar
#      el modo "Transaction" (puerto 6543): pg_dump necesita una sesión
#      Postgres persistente y pgbouncer en modo transaction no se la da —
#      falla o se degrada a mitad del dump.
#      Formato esperado:
#        postgresql://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
#   3. Sustituir <password> por la contraseña real de la base (si no se
#      conoce: Project Settings → Database → "Reset database password").
#      Si la contraseña tiene caracteres especiales (@, /, #, etc.), deben
#      ir URL-encoded dentro de la cadena o pg_dump la interpreta mal.
#   4. En GitHub: Settings del repo → "Secrets and variables" → Actions →
#      "New repository secret" → nombre EXACTO `SUPABASE_DB_URL`, valor la
#      cadena completa del paso 2-3.
#
# CAMINO ALTERNO (2026-10-05): del 2026-07 al 2026-10 este workflow falló TODOS
# los días porque nunca se creó SUPABASE_DB_URL — no hubo ni un respaldo. Ahora
# basta con CUALQUIERA de estos dos secrets:
#   · SUPABASE_DB_URL            → pg_dump completo (esquema + RLS + auth + datos).
#   · SUPABASE_SERVICE_ROLE_KEY  → respaldo de DATOS de todas las tablas de
#     `public` por la API REST (scripts/respaldo-supabase-rest.mjs). Usa además
#     el secret NEXT_PUBLIC_SUPABASE_URL, que ya existe para el CI. El esquema se
#     reconstruye desde supabase/migrations/; las cuentas de auth NO van aquí.
# Con los dos, se hacen los dos (dos copias independientes).
# ============================================================================

on:
  schedule:
    # 09:00 UTC = 03:00 hora de Ciudad de México (México no observa horario
    # de verano desde 2022, así que el offset UTC-6 es constante todo el año).
    - cron: "0 9 * * *"
  # Permite lanzar un backup manual desde la pestaña "Actions" del repo sin
  # esperar al cron — útil para probar la configuración del secret o para
  # sacar un respaldo justo antes de una operación riesgosa (alta masiva,
  # migración, etc.).
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    name: Respaldo → artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Ver qué secrets hay
        id: modo
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPA_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          PG=false; REST=false
          [ -n "$DB_URL" ] && PG=true
          [ -n "$SERVICE_KEY" ] && [ -n "$SUPA_URL" ] && REST=true
          echo "pg=$PG" >> "$GITHUB_OUTPUT"
          echo "rest=$REST" >> "$GITHUB_OUTPUT"
          echo "pg_dump: $PG · REST: $REST"
          if [ "$PG" = false ] && [ "$REST" = false ]; then
            echo "::error::No hay con qué respaldar. Crea el secret SUPABASE_SERVICE_ROLE_KEY (la llave service_role del proyecto) o SUPABASE_DB_URL. Ver el comentario al inicio de .github/workflows/backup-supabase.yml."
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.modo.outputs.rest == 'true'

      - uses: actions/setup-node@v4
        if: steps.modo.outputs.rest == 'true'
        with:
          node-version: "22"

      - name: Respaldo de datos por REST (todas las tablas de public)
        if: steps.modo.outputs.rest == 'true'
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          node scripts/respaldo-supabase-rest.mjs respaldo-rest
          TAMANO=$(stat -c%s respaldo-rest/*.json.gz)
          if [ "$TAMANO" -lt 1024 ]; then
            echo "::error::El respaldo REST pesa solo ${TAMANO} bytes — probablemente falló."
            exit 1
          fi

      - name: Subir respaldo REST como artifact
        if: steps.modo.outputs.rest == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DUMP_NOMBRE }}
          path: ${{ env.DUMP_RUTA }}
          retention-days: 30
          compression-level: 0

      # ubuntu-latest trae postgresql-client desactualizado respecto a los
      # proyectos nuevos de Supabase (Postgres 17). Un pg_dump más viejo que
      # el servidor puede fallar de plano o, peor, omitir en silencio objetos
      # que usan sintaxis reciente (p. ej. ciertas políticas RLS). Se instala
      # la versión 17 exacta del cliente desde el repositorio oficial de
      # PostgreSQL (apt.postgresql.org) en vez de confiar en el apt de Ubuntu.
      - name: Instalar cliente de PostgreSQL 17 (pg_dump)
        if: steps.modo.outputs.pg == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wget ca-certificates gnupg lsb-release
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc             | sudo gpg --dearmor -o /usr/share/keyrings/postgresql-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql-keyring.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main"             | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          pg_dump --version

      - name: Generar dump comprimido
        if: steps.modo.outputs.pg == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          FECHA="$(date -u +%Y%m%d-%H%M)"
          NOMBRE="supabase-backup-${FECHA}.sql.gz"

          # Formato plano: se restaura con `psql -f` sin pg_restore.
          # --no-owner / --no-privileges: para restaurar en un proyecto de
          # recuperación con roles distintos a los del original.
          pg_dump "$SUPABASE_DB_URL"             --format=plain             --no-owner             --no-privileges           | gzip -9 > "${NOMBRE}"

          TAMANO=$(stat -c%s "${NOMBRE}")
          if [ "$TAMANO" -lt 1024 ]; then
            echo "::error::El dump generado (${NOMBRE}) pesa solo ${TAMANO} bytes — probablemente falló. Revisar el log de pg_dump arriba."
            exit 1
          fi

          echo "PGDUMP_NOMBRE=${NOMBRE}" >> "$GITHUB_ENV"
          echo "Dump generado: ${NOMBRE} (${TAMANO} bytes)"

      - name: Subir dump como artifact
        if: steps.modo.outputs.pg == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PGDUMP_NOMBRE }}
          path: ${{ env.PGDUMP_NOMBRE }}
          # 30 días: cabe de sobra en el cupo Free de Actions Storage (500 MB).
          retention-days: 30
          # El .gz ya viene comprimido; recomprimir solo gasta CPU.
          compression-level: 0
